# Example configuration. Run `phrak config` (recommended) or copy this to
# <workspace>/.phrack/config.yaml. All PHRAK state (config, code index, saved
# skills, reports, history) lives in that .phrack/ dir at the workspace root —
# like .claude. The storage paths below are resolved relative to the workspace,
# so ".phrack/rag" means "<workspace>/.phrack/rag".

llm:
  provider: ollama              # ollama | anthropic | openai | grok
  model: qwen2.5-coder:7b       # any pulled Ollama model
  base_url: http://localhost:11434  # Ollama server URL
  temperature: 0.1
  num_ctx: 16384               # ollama context window (code default: 16384)
  max_tokens: 16000            # cloud providers: output cap per response

# A cloud model instead of a local one — `phrak config` and pick the provider:
# llm:
#   provider: anthropic        # Claude API
#   model: claude-opus-5       # or claude-sonnet-5 / claude-haiku-4-5
#   base_url: ""               # empty -> the SDK's own endpoint
#   max_tokens: 16000
# llm:
#   provider: openai           # OpenAI API
#   model: gpt-5               # or gpt-5-mini / gpt-4.1 / any model ID
#   base_url: ""               # empty -> the SDK's own endpoint
# llm:
#   provider: grok             # xAI Grok (OpenAI-wire-compatible)
#   model: grok-4              # or grok-3 / grok-3-mini
#   base_url: https://api.x.ai/v1
# The API key is NEVER stored here. It lives in <workspace>/.phrack/credentials
# (mode 0600) and is exported as ANTHROPIC_API_KEY / OPENAI_API_KEY / XAI_API_KEY
# at startup.

rag:                           # codebase index powering `/ask`
  persist_dir: .phrack/rag     # relative -> <workspace>/.phrack/rag
  collection: phrak_code
  recall_k: 6                  # chunks retrieved per question
  chunk_lines: 60              # lines per indexed chunk
  chunk_overlap: 10            # overlapping lines between chunks
  max_file_kb: 256             # skip files larger than this
  embeddings:                  # always local — Anthropic has no embeddings API
    provider: default          # default (local, no pull) | ollama
    model: nomic-embed-text    # used only by the ollama provider
    base_url: ""               # ollama URL for embeddings; empty -> llm.base_url
                               # when that's Ollama, else http://localhost:11434

paths:
  skills_dir: .phrack/skills   # relative -> <workspace>/.phrack/skills
  reports_dir: .phrack/reports # relative -> <workspace>/.phrack/reports
  workspace: .                 # root the file tools + code index operate under
                               # (and where .phrack/ is anchored)
  clones_dir: clones           # where `phrak clone` shallow-clones repos

orchestrator:                  # how the multi-agent run is planned/executed
  mode: dag                    # dag (dependency graph + parallel fan-out) | linear
  max_concurrency: 3           # bounded parallel agents
  continue_on_failure: true    # isolate a failed task; keep the rest going

analyzers:                     # deterministic analyzers on/off
  opengrep: true
  dependency_audit: true

max_steps: 40                  # per-round tool-call budget
max_rounds: 4                  # run-to-completion: nudges until report is complete
keep_reports: 50               # keep newest N reports; older auto-deleted (0 = all)
enable_git_clone: false        # expose the guarded git_clone tool to agents

# --- Opt-in `verify` agent ---
# The verify agent takes a *confirmed* data-flow finding (from code_review)
# and runs a minimal PoC inside a locked-down container to prove
# exploitability. OFF by default — running attacker payloads is a policy
# decision, not a technical one. Requires docker or podman on PATH.
# With enable_verify on you can run it deliberately per finding:
#   phrak verify FND-284b4aac0d      (or /verify FND-284b4aac0d in chat)
# The PoC scripts it runs are saved under <workspace>/.phrack/pocs/.
enable_verify: false
# Let the DAG planner AUTO-schedule verify inside a full `run`. Off by default
# even when enable_verify is on, so an assessment never silently runs PoCs —
# turn it on only if you want every full run to attempt runtime confirmation.
auto_verify: false
verify_runtime: auto           # auto | docker | podman
verify_image: python:3.12-slim # base image; must have python3 + curl
verify_timeout_s: 30           # per-PoC wall-clock cap
verify_network: none           # none (default) | bridge — none blocks outbound
verify_memory_mb: 512
verify_pids: 128
# Off by default: PHRAK only drives a locally-running instance. Turn on ONLY for
# an authorized engagement (e.g. an in-scope bug-bounty target). Even then, a
# remote host is reachable only if .phrack/scope.yaml is enabled AND lists it in
# allowed_hosts — there is no blanket "any remote host".
allow_remote_targets: false
# verify_target: ""            # default URL for poc-run (e.g. http://localhost:8000)

# Per-agent model overrides. Any subset of the llm: fields above. Agents not
# listed use the base llm: config.
agent_models: {}
#  threat_model:
#    model: glm-4.7-flash        # bigger local model just for threat modeling
#  code_review:
#    temperature: 0.0
